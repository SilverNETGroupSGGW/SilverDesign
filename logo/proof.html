<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Silver — logo proof</title>
<link rel="stylesheet" href="../brand/tokens.css">
<style>
  body { margin: 0; padding: var(--s-6); background: var(--void); color: var(--ink);
         font-family: var(--font-sans); }
  h1 { font: 600 22px/1 var(--font-sans); letter-spacing: -0.02em; margin: 0 0 var(--s-2); }
  .sub { font: 400 14px/1.5 var(--font-sans); color: var(--muted); margin: 0 0 var(--s-6); }
  h2 { font: 500 11px/1 var(--font-mono); letter-spacing: var(--track-label);
       text-transform: uppercase; color: var(--dim);
       margin: var(--s-6) 0 var(--s-3); padding-bottom: var(--s-2);
       border-bottom: 1px solid var(--hairline); }
  .grid { display: grid; gap: var(--s-3);
          grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  figure { margin: 0; }
  .well { display: grid; place-items: center; padding: var(--s-4);
          background: var(--graphite); min-height: 150px; }
  .well.light { background: #E9EBEE; }
  .well img { max-width: 100%; max-height: 210px; display: block; }
  figcaption { font: 400 11px/1.5 var(--font-mono); color: var(--dim);
               margin-top: var(--s-2); word-break: break-all; }
  .sizes { display: flex; align-items: flex-end; gap: var(--s-5);
           background: var(--graphite); padding: var(--s-4); }
  .sizes img { display: block; }
</style>
</head>
<body>
<h1>Logo proof</h1>
<p class="sub">Every file in <code>logo/</code>, rendered. Regenerate with
  <code>python3 tools/build_logo.py</code> — nothing here is drawn by hand.</p>

<h2>Mark</h2>
<div class="grid">
  <figure><div class="well"><img src="silver-mark.svg" alt=""></div>
    <figcaption>silver-mark.svg</figcaption></figure>
  <figure><div class="well"><img src="silver-mark-transparent.svg" alt=""></div>
    <figcaption>silver-mark-transparent.svg</figcaption></figure>
  <figure><div class="well"><img src="silver-mark-mono-white.svg" alt=""></div>
    <figcaption>silver-mark-mono-white.svg</figcaption></figure>
  <figure><div class="well light"><img src="silver-mark-mono-black.svg" alt=""></div>
    <figcaption>silver-mark-mono-black.svg</figcaption></figure>
</div>

<h2>Wordmark</h2>
<div class="grid">
  <figure><div class="well"><img src="silver-wordmark.svg" alt=""></div>
    <figcaption>silver-wordmark.svg</figcaption></figure>
  <figure><div class="well"><img src="silver-wordmark-mono-white.svg" alt=""></div>
    <figcaption>silver-wordmark-mono-white.svg</figcaption></figure>
  <figure><div class="well light"><img src="silver-wordmark-mono-black.svg" alt=""></div>
    <figcaption>silver-wordmark-mono-black.svg</figcaption></figure>
</div>

<h2>Lockups</h2>
<div class="grid">
  <figure><div class="well"><img src="silver-lockup-horizontal.svg" alt=""></div>
    <figcaption>silver-lockup-horizontal.svg</figcaption></figure>
  <figure><div class="well"><img src="silver-lockup-stacked.svg" alt=""></div>
    <figcaption>silver-lockup-stacked.svg</figcaption></figure>
  <figure><div class="well"><img src="silver-lockup-horizontal-mono-white.svg" alt=""></div>
    <figcaption>silver-lockup-horizontal-mono-white.svg</figcaption></figure>
  <figure><div class="well light"><img src="silver-lockup-horizontal-mono-black.svg" alt=""></div>
    <figcaption>silver-lockup-horizontal-mono-black.svg</figcaption></figure>
</div>

<h2>Small sizes — does it still read?</h2>
<div class="sizes">
  <img src="silver-icon.svg" width="16" alt=""><img src="silver-icon.svg" width="24" alt="">
  <img src="silver-icon.svg" width="32" alt=""><img src="silver-icon.svg" width="64" alt="">
  <img src="silver-lockup-horizontal.svg" width="130" alt="">
  <img src="silver-lockup-horizontal.svg" width="220" alt="">
</div>
</body>
</html>
