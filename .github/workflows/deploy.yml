name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      # Pages knows where the site will live (a project repository under its name, a custom domain
      # at the root); the build and the brochure renderer take it from here, so the source never
      # names a path.
      - id: pages
        uses: actions/configure-pages@v6
      - uses: jdx/mise-action@v4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run check
      - run: bun test
      - run: bun run build --site "${{ steps.pages.outputs.origin }}" --base "${{ steps.pages.outputs.base_path }}/"
      - run: bunx playwright install --with-deps chromium
      - run: bun run brochure
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-artifact@v7
        with:
          name: brochures
          path: dist/brochure
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    # On the deploy job alone: a build pending in the same group is cancelled whenever another run
    # queues, which would drop pull request builds.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
