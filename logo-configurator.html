<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SILVER — Logo Configurator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; display: flex; height: 100vh;
    font: 13px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #101114; color: #d8dbe0;
  }
  #panel {
    width: 320px; min-width: 320px; height: 100%; overflow-y: auto;
    background: #17181c; border-right: 1px solid #26282e; padding: 18px 18px 40px;
  }
  #panel h1 {
    font-size: 12px; font-weight: 600; letter-spacing: .22em; margin: 2px 0 18px;
    color: #8b8f98; text-transform: uppercase;
  }
  .group { margin-bottom: 22px; }
  .group h2 {
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: #5f636c; margin: 0 0 8px; border-bottom: 1px solid #232529; padding-bottom: 6px;
  }
  .row { margin: 10px 0; }
  .row label { display: flex; justify-content: space-between; margin-bottom: 4px; color: #b9bdc6; }
  .row label output { color: #f0f2f5; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #b9c1cc; }
  input[type=color] { width: 100%; height: 26px; border: 0; background: none; padding: 0; cursor: pointer; }
  .chk { display: flex; gap: 8px; align-items: center; margin-top: 10px; color: #b9bdc6; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px; }
  #frame {
    width: min(100%, calc((100vh - 56px))); aspect-ratio: 1;
    background:
      repeating-conic-gradient(#22242a 0% 25%, #1a1c20 0% 50%) 0 0 / 22px 22px;
    border-radius: 8px; overflow: hidden; box-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  #frame svg, #frame img { width: 100%; height: 100%; display: block; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  button {
    background: #26282e; color: #e6e8ec; border: 1px solid #33363d; border-radius: 6px;
    padding: 9px 6px; font-size: 12px; cursor: pointer;
  }
  button:hover { background: #2f323a; }
  button.primary { background: #3b4452; border-color: #4a5568; }
  select {
    width: 100%; background: #26282e; color: #e6e8ec; border: 1px solid #33363d;
    border-radius: 6px; padding: 7px; margin-bottom: 8px;
  }
</style>
</head>
<body>
<div id="panel">
  <h1>SILVER · logo configurator</h1>

  <div class="group"><h2>Presets</h2>
    <select id="preset"></select>
  </div>

  <div class="group" id="shape"><h2>S shape</h2></div>
  <div class="group" id="width"><h2>Width &amp; slope</h2></div>
  <div class="group" id="orient"><h2>Orientation</h2></div>
  <div class="group" id="framing"><h2>Framing</h2></div>
  <div class="group" id="look">
    <h2>Look</h2>
    <div class="row"><label>Background <input type="color" id="bg" value="#15171b"></label></div>
    <div class="chk"><input type="checkbox" id="transparent"><span>transparent background</span></div>
    <div class="row" style="margin-top:10px"><label>Ink color <input type="color" id="ink" value="#e8e8ea"></label></div>
    <div class="chk"><input type="checkbox" id="solidColor"><span>solid color instead of texture</span></div>
  </div>

  <div class="group" id="tex">
    <h2>Texture</h2>
    <div class="row"><label>Custom texture</label>
      <input type="file" id="texFile" accept="image/*" style="color:#8b8f98;font-size:11px">
      <button id="texReset" style="margin-top:6px;width:100%">reset texture</button>
    </div>
  </div>

  <div class="group"><h2>Export</h2>
    <div class="btns">
      <button class="primary" id="dlSvg">SVG</button>
      <button class="primary" id="dlSvgT">SVG · transparent</button>
      <button id="dlPng">PNG 2400</button>
      <button id="dlPngT">PNG · transparent</button>
    </div>
    <button id="copySettings" style="margin-top:8px;width:100%">copy settings JSON</button>
    <input type="text" id="settingsOut" readonly
      style="width:100%;margin-top:6px;background:#101114;border:1px solid #26282e;color:#8b8f98;font-size:10px;padding:4px 6px;border-radius:4px;opacity:.7"
      onclick="this.select()">
    <input type="text" id="settingsIn" placeholder="paste settings JSON…"
      style="width:100%;margin-top:8px;background:#101114;border:1px solid #33363d;color:#d8dbe0;font-size:10px;padding:4px 6px;border-radius:4px">
    <button id="applySettings" style="margin-top:6px;width:100%">apply settings</button>
  </div>
</div>
<div id="stage"><div id="frame"></div></div>

<script>
"use strict";
/* ---- geometry: exact port of the python pipeline ---- */
const BASE_ANGLE = 27.07, CX = 600, CY = 600;
const A = [612, 356], M = [600, 600];
const NST = 30, N = 200, N2 = 400;

const rad = d => d * Math.PI / 180;
const rotvis = (x, y, deg) => { const c = Math.cos(rad(deg)), s = Math.sin(rad(deg)); return [x*c + y*s, -x*s + y*c]; };
const rot180 = (x, y) => [1200 - x, 1200 - y];
const sclp = (p, k) => [600 + k*(p[0]-600), 600 + k*(p[1]-600)];
const rotPT = (p, deg) => { const [rx, ry] = rotvis(p[0]-CX, p[1]-CY, deg); return [CX+rx, CY+ry]; };
const cubic = (p0,p1,p2,p3,t) => {
  const u = 1-t, a=u**3, b=3*u*u*t, c=3*u*t*t, d=t**3;
  return [a*p0[0]+b*p1[0]+c*p2[0]+d*p3[0], a*p0[1]+b*p1[1]+c*p2[1]+d*p3[1]];
};
const sstep = t => t*t*t*(t*(t*6-15)+10);
// taper profile for the band finish. c = 0 keeps the smootherstep ramp; raising
// it blends toward a concave quarter arc, so the taper edge bows inward — the
// curve is cut out of the band rather than bulging into the negative space.
// Both limits still run 0 -> 1 over the slope, so the ends stay flush.
function taper(t, c) {
  const s = sstep(t);
  if (!c) return s;
  const k = Math.min(Math.max(c / 100, 0), 1);
  const inward = 1 - Math.sqrt(Math.max(0, 1 - t*t));
  return s + (inward - s) * k;
}
// Rounds the taper's kink into full band width the way border-radius rounds a
// box corner. Both edges keep their exact shape up to their tangent points, so
// nothing outside the corner moves. Solved against the taper as a curve, not
// its tangent line, so the arc stays tangent at any slopeCurve.
function kneeFillet(P, HW) {
  const bw = P.bandWidth;
  const r = Math.min(P.slopeRound, (bw - 2*HW) * 0.95, (900 - P.slopeLen) * 0.95);
  if (r <= 0) return null;
  const wAt = s => 2*HW + (bw - 2*HW) * taper(Math.min(s / P.slopeLen, 1), P.slopeCurve);
  const cy = bw - r, NS = 600, s0 = Math.max(0, P.slopeLen - 8*r);
  const near = c => {
    let d2 = Infinity, at = P.slopeLen;
    for (let i = 0; i <= NS; i++) {
      const s = s0 + (P.slopeLen - s0) * i / NS;
      const dx = s - c, dy = wAt(s) - cy, d = dx*dx + dy*dy;
      if (d < d2) { d2 = d; at = s; }
    }
    return { d2, s: at };
  };
  // the centre rides the flat edge at depth r, so tangency reduces to
  // distance-to-taper == r and a bisection on how far out it sits
  let lo = P.slopeLen, hi = P.slopeLen + 3*r;
  for (let k = 0; k < 30; k++) {
    const mid = (lo + hi) / 2;
    if (near(mid).d2 < r*r) lo = mid; else hi = mid;
  }
  const st = near(hi).s;
  return st < hi ? { r, c: hi, cy, st } : null;
}
const fmt = n => n.toFixed(1);
// The rings overlap at the joints, so they ship as subpaths of one path and are
// filled once as a union; separately, any pair of touching antialiased edges
// composites to ~75% and shows the background through as a hairline. Nonzero
// needs every ring wound the same way, or the overlap punches back out.
const signedArea = pts => {
  let a = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const q = pts[(i+1) % n];
    a += pts[i][0]*q[1] - q[0]*pts[i][1];
  }
  return a / 2;
};
const pathOf = pts => "M " + (signedArea(pts) < 0 ? pts.slice().reverse() : pts)
  .map(p => fmt(p[0])+" "+fmt(p[1])).join(" L ") + " Z";

function bandAxis(P) {
  const u0 = [-Math.cos(rad(BASE_ANGLE)), Math.sin(rad(BASE_ANGLE))];
  const u2 = rotvis(u0[0], u0[1], P.lean);
  const n2 = [-u2[1], u2[0]];
  const HW = P.lineWidth / 2;
  const A2base = rotPT(sclp(A, P.scale), P.lean);
  const A2 = [A2base[0] + u2[0]*P.slopeStart, A2base[1] + u2[1]*P.slopeStart]; // joint slides toward center
  return { u2, uo2: [-u2[0], -u2[1]], n2, inn2: [-n2[0], -n2[1]], HW, A2,
           Pouter: [A2[0] + n2[0]*HW, A2[1] + n2[1]*HW] };
}

// Signed difference between the run the band cuts off the frame's top edge and
// the run it cuts off the side; zero is a symmetric corner exit. Projecting a
// frame edge onto the band normal is affine in that edge's own coordinate, so
// the covered span inverts directly instead of needing a clip.
function cutDiff(P, lean) {
  const { inn2, Pouter } = bandAxis({ ...P, lean });
  const vb = 1200 / P.zoom, o = 600 - vb/2, hi = o + vb;
  const [ix, iy] = inn2, [px, py] = Pouter, W = P.bandWidth;
  const run = (c0, k) => {
    if (Math.abs(k) < 1e-12) return (c0 >= 0 && c0 <= W) ? vb : 0;
    const a = -c0/k, b = (W - c0)/k;
    return Math.max(0, Math.min(Math.max(a, b), hi) - Math.max(Math.min(a, b), o));
  };
  return run((o - py)*iy - px*ix, ix) - run((hi - px)*ix - py*iy, iy);
}

// Lean is bounded and cutDiff runs monotonically across it in practice, but a
// bracket is not guaranteed at every zoom, so fall back to the closest match.
function equalCutLean(P, lo = -35, hi = 35) {
  let flo = cutDiff(P, lo);
  if (flo * cutDiff(P, hi) > 0) {
    let best = lo, bd = Infinity;
    for (let L = lo; L <= hi; L += 0.05) {
      const d = Math.abs(cutDiff(P, L));
      if (d < bd) { bd = d; best = L; }
    }
    return best;
  }
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2, f = cutDiff(P, mid);
    if ((f < 0) === (flo < 0)) { lo = mid; flo = f; } else { hi = mid; }
  }
  return (lo + hi) / 2;
}

function build(P) {
  const { u2, uo2, n2, inn2, HW, A2, Pouter } = bandAxis(P);
  const wv0 = rotvis(0.928, 0.371, P.lean + P.waistTilt);
  const wl = Math.hypot(wv0[0], wv0[1]); const wv = [wv0[0]/wl, wv0[1]/wl];

  // S spine: straight neck -> entry bend -> belly -> center (+ mirror)
  const st = [];
  for (let i = 0; i < NST; i++) st.push([A2[0]+u2[0]*P.neck*i/NST, A2[1]+u2[1]*P.neck*i/NST]);
  const P0 = st[st.length-1];
  const P1 = [P0[0]+u2[0]*P.entryH, P0[1]+u2[1]*P.entryH];
  const P2 = [M[0]-wv[0]*P.waistH, M[1]-wv[1]*P.waistH];
  const arc = [], arc2 = [];
  for (let i = 0; i < N; i++) arc.push(cubic(P0, P1, P2, M, i/N));
  const P0b = rot180(...P0), P1b = rot180(...P1), P2b = rot180(...P2);
  for (let i = 0; i < N; i++) arc2.push(cubic(M, P2b, P1b, P0b, i/N));
  const st2 = st.slice().reverse().map(p => rot180(...p));
  // neck = 0 collapses the straight run onto one spot, and coincident points
  // give a zero-length tangent -> zero normal -> the ribbon pinches shut at the
  // joint, opening a wedge against the band. Offsetting needs distinct points.
  const spine = [];
  for (const p of st.concat(arc, arc2, st2)) {
    const q = spine[spine.length-1];
    if (!q || Math.abs(p[0]-q[0]) + Math.abs(p[1]-q[1]) > 1e-9) spine.push(p);
  }

  // ribbon outline
  const L = [], R = [];
  for (let i = 0; i < spine.length; i++) {
    const a = spine[Math.max(0, i-1)], b = spine[Math.min(spine.length-1, i+1)];
    const dx = b[0]-a[0], dy = b[1]-a[1], ln = Math.hypot(dx, dy) || 1;
    const nx = -dy/ln, ny = dx/ln;
    L.push([spine[i][0]+nx*HW, spine[i][1]+ny*HW]);
    R.push([spine[i][0]-nx*HW, spine[i][1]-ny*HW]);
  }
  const sPath = pathOf(L.concat(R.slice().reverse()));

  // sloped band: straight outer edge + smootherstep underside taper
  const fil = kneeFillet(P, HW);
  // The ribbon's end normal comes from a one-sided chord, so it sits a fraction
  // of a degree off the band's, and abutting edges leave a tapering wedge of
  // background. Starting the band behind the joint buries that in an overlap;
  // s < 0 clamps the taper to lineWidth, so the stub matches the ribbon exactly.
  const JOIN_OVERLAP = 2;
  const outer = [], inner = [];
  for (let i = 0; i <= N2; i++) {
    const s = i/N2*(900 + JOIN_OVERLAP) - JOIN_OVERLAP;
    const e = [Pouter[0]+uo2[0]*s, Pouter[1]+uo2[1]*s];
    outer.push(e);
    const t = Math.max(0, Math.min(s/P.slopeLen, 1));
    const w = (fil && s >= fil.st && s <= fil.c)
      ? fil.cy + Math.sqrt(Math.max(0, fil.r*fil.r - (s - fil.c)*(s - fil.c)))
      : 2*HW + (P.bandWidth-2*HW)*taper(t, P.slopeCurve);
    inner.push([e[0]+inn2[0]*w, e[1]+inn2[1]*w]);
  }
  const bandTop = pathOf(outer.slice().reverse().concat(inner));
  const bandBot = pathOf(outer.slice().reverse().concat(inner).map(p => rot180(...p)));
  return { sPath, bandTop, bandBot };
}

/* ---- svg assembly ---- */
function svgString(P, textureUri, withBg) {
  const g = build(P);
  const vb = 1200 / P.zoom, o = 600 - vb/2;
  // Lets a texture that does not tile seamlessly still loop without a visible
  // edge once offset: every seam meets its own reflection.
  // Full precision, not fmt(): 2 * fmt(vb) != fmt(2 * vb), and the difference
  // opens a gap down the mirror seam. The mirrored copies also bleed back across
  // each seam, since abutting <image> edges resample independently and hairline
  // even when they meet exactly; their outer edges stay on the tile boundary so
  // the tile still repeats clean.
  const W = +vb.toFixed(4), M = 2*W, bleed = W/400;
  const tw = P.texMirrorX ? M : W, th = P.texMirrorY ? M : W;
  const cell = (w, h, t) => `      <image href="${textureUri}" x="0" y="0" width="${w}" height="${h}"${t}/>`;
  const tile = [cell(W, W, "")];
  if (P.texMirrorX) tile.push(cell(W + bleed, W, ` transform="translate(${M},0) scale(-1,1)"`));
  if (P.texMirrorY) tile.push(cell(W, W + bleed, ` transform="translate(0,${M}) scale(1,-1)"`));
  if (P.texMirrorX && P.texMirrorY) tile.push(cell(W + bleed, W + bleed, ` transform="translate(${M},${M}) scale(-1,-1)"`));
  // Zoomed out, a 1200-wide bg stops short and lets the stage checkerboard
  // show through the artwork.
  const bg = withBg ? `  <rect x="${fmt(o)}" y="${fmt(o)}" width="${fmt(vb)}" height="${fmt(vb)}" fill="${P.bg}"/>\n` : "";
  const fill = P.solidColor ? P.ink : "url(#foil)";
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${fmt(o)} ${fmt(o)} ${fmt(vb)} ${fmt(vb)}" width="1200" height="1200">
  <defs>
    <pattern id="foil" patternUnits="userSpaceOnUse" x="${+(o + P.texX/100*vb).toFixed(4)}" y="${+(o + P.texY/100*vb).toFixed(4)}" width="${tw}" height="${th}">
${tile.join("\n")}
    </pattern>
  </defs>
${bg}  <path d="${g.bandTop} ${g.bandBot} ${g.sPath}" fill="${fill}"/>
</svg>`;
}

/* ---- state / controls ---- */
const DEFAULTS = {
  scale: 0.72, neck: 2, entryH: 100, waistTilt: 15, waistH: 125,
  lineWidth: 32, bandWidth: 130, slopeLen: 140, slopeStart: 0, slopeCurve: 0, slopeRound: 0,
  lean: 20, zoom: 1.0, brightness: 1.0, bg: "#15171b", ink: "#e8e8ea", solidColor: false,
  texX: 0, texY: 0, texMirrorX: false, texMirrorY: false
};
const SLIDERS = [
  // [group, key, label, min, max, step]
  ["shape", "scale",     "joint distance",   0.40, 0.90, 0.01],
  ["shape", "neck",      "neck length",      0, 70, 1],
  ["shape", "entryH",    "entry handle",     60, 180, 1],
  ["shape", "waistTilt", "waist tilt °",     -30, 45, 1],
  ["shape", "waistH",    "waist handle",     80, 220, 1],
  ["width", "lineWidth", "narrow width",     16, 60, 1],
  ["width", "bandWidth", "band width",       90, 180, 1],
  ["width", "slopeLen",  "slope length",     60, 400, 1],
  ["width", "slopeStart","slope start (narrow neck)", 0, 160, 1],
  ["width", "slopeCurve","slope curve (inward)", 0, 100, 1],
  ["width", "slopeRound","corner radius",      0, 120, 1],
  ["orient","lean",      "lean °",           -35, 35, 0.01],
  ["framing","zoom",    "zoom",             0.40, 2.50, 0.01],
  ["tex",   "brightness","texture brightness", 0.6, 1.4, 0.01],
  ["tex",   "texX",      "texture offset X %", -100, 100, 1],
  ["tex",   "texY",      "texture offset Y %", -100, 100, 1],
];
const PRESETS = {
  "Current (delivered)": { ...DEFAULTS },
  "Long neck":           { ...DEFAULTS, neck: 45, slopeLen: 240 },
  "Tight center":        { ...DEFAULTS, scale: 0.62, neck: 10, slopeLen: 160 },
  "Thick":               { ...DEFAULTS, lineWidth: 44, bandWidth: 160 },
  "Steep lean":          { ...DEFAULTS, lean: 28 },
  "Curved finish":       { ...DEFAULTS, slopeLen: 200, slopeCurve: 70 },
  "Macro crop":          { ...DEFAULTS, scale: 0.74, neck: 0, entryH: 85, waistTilt: 37,
                           waistH: 198, lineWidth: 50, bandWidth: 136, slopeLen: 168,
                           slopeStart: 94, slopeCurve: 96, lean: 3.5, zoom: 2.30 },
};
const state = { ...DEFAULTS };
let textureUri = null, textureImg = null;

/* ---- persistence ---- */
const STORAGE_KEY = "silver-logo-config.v1";
let textureDataUrl = null;
function settingsJSON() {
  return JSON.stringify({
    scale: state.scale, neck: state.neck, entryH: state.entryH,
    waistTilt: state.waistTilt, waistH: state.waistH,
    lineWidth: state.lineWidth, bandWidth: state.bandWidth,
    slopeLen: state.slopeLen, slopeStart: state.slopeStart,
    slopeCurve: state.slopeCurve, slopeRound: state.slopeRound,
    lean: state.lean, zoom: state.zoom, brightness: state.brightness, bg: state.bg,
    ink: state.ink, solidColor: state.solidColor,
    texX: state.texX, texY: state.texY,
    texMirrorX: state.texMirrorX, texMirrorY: state.texMirrorY,
    transparent: document.getElementById("transparent").checked
  });
}
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...JSON.parse(settingsJSON()), tex: textureDataUrl })); }
  catch {}
}

function applySettings(obj) {
  for (const k in rows) if (k in obj) { rows[k].value = obj[k]; rows[k].dispatchEvent(new Event("input")); }
  if (obj.bg) { state.bg = obj.bg; document.getElementById("bg").value = obj.bg; }
  if (obj.ink) { state.ink = obj.ink; document.getElementById("ink").value = obj.ink; }
  const tr = document.getElementById("transparent");
  if (obj.transparent !== undefined) tr.checked = !!obj.transparent;
  const sc = document.getElementById("solidColor");
  if (obj.solidColor !== undefined) { sc.checked = state.solidColor = !!obj.solidColor; }
  for (const k in checks) if (obj[k] !== undefined) { checks[k].checked = state[k] = !!obj[k]; }
  if (obj.tex) { textureDataUrl = obj.tex; loadTexture(obj.tex); }
  persist(); render();
}

const setP = (k, v) => { state[k] = v; persist(); schedule(); };
let raf = null;
function schedule(){ if (!raf) raf = requestAnimationFrame(() => { raf = null; render(); }); }

const rows = {};
for (const [grp, key, label, mn, mx, step] of SLIDERS) {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `<label>${label} <output></output></label>`;
  const sl = document.createElement("input");
  sl.type = "range"; sl.min = mn; sl.max = mx; sl.step = step; sl.value = state[key];
  const out = div.querySelector("output");
  const show = () => out.value = Number(sl.value).toFixed(step < 1 ? (step < 0.1 ? 2 : 1) : 0);
  sl.addEventListener("input", () => { show(); setP(key, parseFloat(sl.value)); if (key === "brightness") refreshTexture(); });
  show(); div.appendChild(sl);
  document.getElementById(grp).appendChild(div);
  rows[key] = sl;
}
const checks = {};
for (const [key, label] of [["texMirrorX", "mirror tiling · X"], ["texMirrorY", "mirror tiling · Y"]]) {
  const div = document.createElement("div");
  div.className = "chk";
  const cb = document.createElement("input");
  cb.type = "checkbox"; cb.id = key; cb.checked = state[key];
  cb.addEventListener("change", () => { state[key] = cb.checked; persist(); render(); });
  const sp = document.createElement("span"); sp.textContent = label;
  div.appendChild(cb); div.appendChild(sp);
  document.getElementById("tex").appendChild(div);
  checks[key] = cb;
}
const syncChecks = () => { for (const k in checks) checks[k].checked = !!state[k]; };

const eqCut = document.createElement("button");
eqCut.textContent = "equal X/Y cut";
eqCut.style.width = "100%";
eqCut.title = "lean so the band leaves the frame corner symmetrically";
eqCut.addEventListener("click", () => {
  rows.lean.value = equalCutLean(state).toFixed(2);
  rows.lean.dispatchEvent(new Event("input"));
});
document.getElementById("orient").appendChild(eqCut);

const presetSel = document.getElementById("preset");
for (const name of Object.keys(PRESETS)) {
  const o = document.createElement("option"); o.value = name; o.textContent = name;
  presetSel.appendChild(o);
}
presetSel.addEventListener("change", () => {
  Object.assign(state, PRESETS[presetSel.value]);
  for (const k in rows) { rows[k].value = state[k]; rows[k].dispatchEvent(new Event("input")); }
  syncChecks();
  refreshTexture();
});
document.getElementById("bg").addEventListener("input", e => setP("bg", e.target.value));
document.getElementById("ink").addEventListener("input", e => setP("ink", e.target.value));
document.getElementById("solidColor").addEventListener("change", e => { state.solidColor = e.target.checked; persist(); render(); });
document.getElementById("transparent").addEventListener("change", e => { persist(); render(); });

const defaultTexSrc = "data:image/jpeg;base64," + document.getElementById("texture").textContent.trim();
function loadTexture(src) {
  const img = new Image();
  img.onload = () => { textureImg = img; refreshTexture(); render(); };
  img.src = src;
}
document.getElementById("texFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { textureDataUrl = rd.result; loadTexture(rd.result); persist(); };
  rd.readAsDataURL(f);
});
document.getElementById("texReset").addEventListener("click", () => {
  document.getElementById("texFile").value = "";
  textureDataUrl = null;
  loadTexture(defaultTexSrc);
  persist();
});

/* ---- texture + brightness via canvas filter ---- */
function refreshTexture() {
  if (!textureImg) return;
  const c = document.createElement("canvas"); c.width = c.height = 1200;
  const ctx = c.getContext("2d");
  ctx.filter = `brightness(${state.brightness.toFixed(2)})`;
  ctx.drawImage(textureImg, 0, 0, 1200, 1200);
  textureUri = c.toDataURL("image/jpeg", 0.85);
}

/* ---- render ---- */
const frame = document.getElementById("frame");
function render() {
  if (!textureUri) return;
  const transparent = document.getElementById("transparent").checked;
  frame.innerHTML = svgString(state, textureUri, !transparent);
}

/* ---- export ---- */
function download(name, blob) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
document.getElementById("dlSvg").onclick  = () => download("silver-logo.svg",            new Blob([svgString(state, textureUri, true)],  {type:"image/svg+xml"}));
document.getElementById("dlSvgT").onclick = () => download("silver-logo-transparent.svg",new Blob([svgString(state, textureUri, false)], {type:"image/svg+xml"}));
function exportPng(transparent) {
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas"); c.width = c.height = 2400;
    const ctx = c.getContext("2d");
    ctx.drawImage(img, 0, 0, 2400, 2400);
    c.toBlob(b => download(transparent ? "silver-logo-transparent.png" : "silver-logo.png", b), "image/png");
  };
  img.src = "data:image/svg+xml;base64," + btoa(svgString(state, textureUri, !transparent));
}
document.getElementById("dlPng").onclick  = () => exportPng(false);
document.getElementById("dlPngT").onclick = () => exportPng(true);

/* ---- boot: restore saved settings, then load texture ---- */
const saved = (() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || ""); } catch { return null; } })();
if (saved) applySettings(saved);
loadTexture(textureDataUrl || defaultTexSrc);

/* ---- settings export ---- */
const settingsOut = document.getElementById("settingsOut");
document.getElementById("copySettings").addEventListener("click", async (e) => {
  const json = settingsJSON();
  settingsOut.value = json;
  const btn = e.target, old = btn.textContent;
  try { await navigator.clipboard.writeText(json); btn.textContent = "copied ✓"; }
  catch {
    settingsOut.select();
    try { document.execCommand("copy"); btn.textContent = "copied ✓"; }
    catch { btn.textContent = "select & ctrl-c"; settingsOut.style.opacity = 1; }
  }
  setTimeout(() => btn.textContent = old, 1200);
});
document.getElementById("applySettings").addEventListener("click", () => {
  const inp = document.getElementById("settingsIn");
  try {
    const obj = JSON.parse(inp.value);
    applySettings(obj);
    inp.value = settingsJSON();
  } catch {
    inp.style.borderColor = "#c05050";
    setTimeout(() => inp.style.borderColor = "", 900);
  }
});
</script>
</body>
</html>
