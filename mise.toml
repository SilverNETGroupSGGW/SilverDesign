[tools]
bun = "1.4.0"

[tasks.dev]
run = "bun run dev"
[tasks.check]
run = "bun run check"
[tasks.lint]
run = "bun run lint"
[tasks.fmt]
run = "bun run fmt"
[tasks.test]
run = "bun test"
[tasks.build]
run = "bun run build"
[tasks."logo:export"]
run = "bun run logo:export"
[tasks.brochure]
depends = ["build"]
run = "bun run brochure"
